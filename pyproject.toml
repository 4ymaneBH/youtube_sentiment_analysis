[project]
name = "youtube-sentiment-analyses"
version = "0.1.0"
description = "Classify and visualize the sentiment of YouTube comments"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.135.1",
    "joblib==1.5.2",
    "numpy==2.2.6",
    "pydantic==2.11.7",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "threadpoolctl>=3.6,<4",
    "uvicorn==0.40.0",
]

[dependency-groups]
train = ["matplotlib==3.10.7"]
dev = ["httpx==0.28.1", "pytest==9.0.2", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
